<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los 3 Encantos — Comidas Criollas y Marinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2E3C6;
    --cream2:#EAD5AF;
    --paper:#FCF4E4;
    --red:#B01E23;
    --red-dark:#8A1418;
    --brown:#5A2A1E;
    --brown-soft:#7A4636;
    --chalk-bg:#211E1B;
    --chalk-blue:#7FCBE0;
    --chalk-cream:#F4E9D2;
    --heart:#E23744;
    --gold:#E0A93B;
    --line:rgba(90,42,30,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream);
    color:var(--brown);
    font-family:'Nunito',sans-serif;
    overflow-x:hidden;
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(224,169,59,0.14), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(176,30,35,0.10), transparent 55%);
  }
  ::selection{ background:var(--red); color:#fff; }
  h1,h2,h3{ font-family:'Fredoka',sans-serif; }
  .script{ font-family:'Pacifico',cursive; }

  /* ---------- Floating hearts ---------- */
  #hearts{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
  .heart{
    position:absolute; bottom:-24px; color:var(--heart); opacity:0.35;
    animation:heartRise linear infinite; font-size:14px;
  }
  @keyframes heartRise{
    0%{ transform:translateY(0) translateX(0) rotate(0); opacity:0; }
    12%{ opacity:0.4; }
    100%{ transform:translateY(-112vh) translateX(var(--drift,20px)) rotate(30deg); opacity:0; }
  }

  /* ---------- Hero ---------- */
  header{
    position:relative; z-index:2;
    min-height:88vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:50px 20px 30px;
  }
  .hero-logo{ max-width:min(560px,88vw); width:100%; height:auto;
    filter:drop-shadow(0 6px 16px rgba(90,42,30,0.28));
    opacity:0; animation:fadeUp 0.9s ease forwards 0.3s; }
  .hero-script{ font-family:'Pacifico',cursive; color:var(--red); font-size:clamp(1.6rem,4.5vw,2.6rem);
    margin-top:10px; opacity:0; animation:fadeUp 0.9s ease forwards 0.7s;
    text-shadow:1px 2px 0 rgba(255,255,255,0.6); }
  .hero-sub{ font-family:'Fredoka',sans-serif; font-weight:600; letter-spacing:0.28em;
    text-transform:uppercase; color:var(--brown-soft); font-size:0.8rem; margin-top:14px;
    display:flex; align-items:center; gap:10px; opacity:0; animation:fadeUp 0.9s ease forwards 1s; }
  .hero-sub::before,.hero-sub::after{ content:"❤"; color:var(--heart); font-size:0.7rem; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(24px);} to{ opacity:1; transform:translateY(0);} }

  .scroll-cue{ margin-top:40px; width:2px; height:44px; background:linear-gradient(var(--red), transparent);
    position:relative; opacity:0; animation:fadeUp 1s ease forwards 1.3s; }
  .scroll-cue::after{ content:"❤"; position:absolute; left:-6px; top:-6px; color:var(--heart); font-size:0.7rem;
    animation:cueDrop 2s ease-in-out infinite; }
  @keyframes cueDrop{ 0%{ top:-6px; opacity:1;} 90%{opacity:0;} 100%{ top:40px; opacity:0;} }

  /* ---------- Sticky nav ---------- */
  nav{
    position:sticky; top:0; z-index:10;
    background:rgba(242,227,198,0.94); backdrop-filter:blur(8px);
    border-bottom:2px solid var(--red);
    display:flex; justify-content:center; flex-wrap:wrap; gap:8px; padding:12px 16px;
  }
  .tab{
    background:transparent; border:2px solid var(--red); border-radius:30px; cursor:pointer;
    color:var(--red); font-family:'Fredoka',sans-serif; font-weight:600; font-size:0.82rem;
    letter-spacing:0.06em; text-transform:uppercase; padding:9px 20px;
    transition:all 0.28s ease;
  }
  .tab:hover{ background:rgba(176,30,35,0.1); }
  .tab.active{ background:var(--red); color:#fff; box-shadow:0 4px 12px rgba(176,30,35,0.35); }

  /* ---------- Main ---------- */
  main{ position:relative; z-index:2; max-width:900px; margin:0 auto; padding:56px 22px 110px; }
  .panel{ display:none; }
  .panel.active{ display:block; animation:panelIn 0.5s ease; }
  @keyframes panelIn{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:translateY(0);} }

  /* Ribbon banner */
  .ribbon{ position:relative; display:block; width:max-content; max-width:100%; margin:0 auto 14px;
    background:var(--red); color:#fff; font-family:'Fredoka',sans-serif; font-weight:700;
    font-size:clamp(1.6rem,5vw,2.6rem); letter-spacing:0.04em; text-transform:uppercase;
    padding:12px 46px; border-radius:8px;
    box-shadow:0 6px 0 var(--red-dark), 0 10px 20px rgba(90,42,30,0.25); }
  .ribbon::before,.ribbon::after{ content:""; position:absolute; top:50%; width:22px; height:22px;
    background:var(--red-dark); transform:translateY(-50%) rotate(45deg); }
  .ribbon::before{ left:-9px; } .ribbon::after{ right:-9px; }
  .panel-sub{ text-align:center; font-family:'Pacifico',cursive; color:var(--brown-soft);
    font-size:1.1rem; margin-bottom:34px; }

  /* Price badge */
  .price-badge{ display:flex; justify-content:center; margin:0 auto 40px; }
  .price-badge .circle{
    width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d0343a, var(--red) 55%, var(--red-dark));
    color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 10px 26px rgba(176,30,35,0.45); border:4px solid #fff;
    animation:pop 0.7s cubic-bezier(.2,.9,.2,1) forwards; }
  .price-badge .lbl{ font-family:'Fredoka',sans-serif; font-weight:600; text-transform:uppercase;
    letter-spacing:0.18em; font-size:0.72rem; }
  .price-badge .val{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:3rem; line-height:1; }
  @keyframes pop{ from{opacity:0; transform:scale(.8) rotate(-6deg);} to{opacity:1; transform:scale(1) rotate(-4deg);} }

  /* Chalkboard (menú del día) */
  .chalkboard{ background:var(--chalk-bg); border:10px solid #6b4a2f;
    border-radius:14px; padding:34px 30px; box-shadow:inset 0 0 40px rgba(0,0,0,0.5), 0 12px 30px rgba(90,42,30,0.3);
    background-image:radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.04), transparent 60%); }
  .chalk-group{ margin-bottom:26px; }
  .chalk-group:last-child{ margin-bottom:0; }
  .chalk-group h3{ font-family:'Fredoka',sans-serif; color:var(--gold); font-size:1.5rem;
    margin-bottom:10px; }
  .chalk-item{ display:flex; align-items:flex-start; gap:12px; padding:6px 0;
    color:var(--chalk-blue); font-family:'Fredoka',sans-serif; font-weight:500; font-size:1.15rem;
    opacity:0; transform:translateX(-12px); }
  .chalk-item.reveal{ animation:slideIn 0.5s ease forwards; }
  @keyframes slideIn{ to{ opacity:1; transform:translateX(0);} }
  .chalk-item::before{ content:"✱"; color:var(--gold); font-size:1rem; margin-top:3px; }
  .chalk-item small{ display:block; color:var(--chalk-cream); opacity:0.7; font-family:'Nunito',sans-serif;
    font-weight:400; font-size:0.82rem; margin-top:2px; }

  /* Cards (à la carta / bebidas) */
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; }
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; overflow:hidden;
    box-shadow:0 6px 18px rgba(90,42,30,0.12); display:flex; flex-direction:column;
    opacity:0; transform:translateY(20px); transition:transform 0.3s ease, box-shadow 0.3s ease; }
  .card.reveal{ animation:cardIn 0.55s ease forwards; }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0);} }
  .card:hover{ transform:translateY(-5px); box-shadow:0 14px 30px rgba(90,42,30,0.2); }
  .card-img{ width:100%; aspect-ratio:5/2.3; object-fit:contain; padding:10px 14px;
    background:linear-gradient(160deg, var(--paper), var(--cream2));
    border-bottom:1px solid var(--line); }
  .card-body{ padding:16px 18px 20px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .card-name{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.2rem; color:var(--brown); line-height:1.15; }
  .card-price{ background:var(--red); color:#fff; font-family:'Fredoka',sans-serif; font-weight:700;
    font-size:0.92rem; padding:5px 12px; border-radius:20px; white-space:nowrap;
    box-shadow:0 3px 8px rgba(176,30,35,0.3); }
  .card-desc{ color:var(--brown-soft); font-size:0.9rem; line-height:1.5; }

  /* Secciones de carta (precio por grupo) */
  .menu-sections{ display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:22px; align-items:start; }
  .menu-section{ background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:22px 24px; box-shadow:0 6px 18px rgba(90,42,30,0.12);
    opacity:0; transform:translateY(20px); }
  .menu-section.reveal{ animation:cardIn 0.55s ease forwards; }
  .menu-section-head{ display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding-bottom:12px; margin-bottom:14px; border-bottom:2px dashed var(--line); }
  .menu-section-head h3{ font-family:'Fredoka',sans-serif; font-weight:700; text-transform:uppercase;
    color:var(--red); font-size:1.3rem; line-height:1.05; }
  .menu-section-price{ background:var(--red); color:#fff; font-family:'Fredoka',sans-serif; font-weight:700;
    font-size:0.95rem; padding:6px 14px; border-radius:22px; white-space:nowrap;
    box-shadow:0 3px 8px rgba(176,30,35,0.3); }
  .menu-list-item{ display:flex; align-items:flex-start; gap:10px; padding:5px 0;
    color:var(--brown); font-size:0.98rem; line-height:1.35; }
  .menu-list-item::before{ content:"❤"; color:var(--heart); font-size:0.7rem; margin-top:5px; flex-shrink:0; }

  /* Divider */
  .divider{ display:flex; align-items:center; justify-content:center; gap:12px; margin:40px 0;
    color:var(--heart); }
  .divider::before,.divider::after{ content:""; height:1px; width:70px; background:var(--line); }

  footer{ position:relative; z-index:2; text-align:center; padding:44px 20px 60px;
    background:var(--red); color:#fff; }
  footer .fname{ font-family:'Pacifico',cursive; font-size:1.8rem; margin-bottom:8px; }
  footer .addr{ font-family:'Fredoka',sans-serif; font-weight:500; }
  footer .foot-tag{ opacity:0.9; margin-top:8px; font-size:0.9rem; }
  footer .foot-tag .script{ font-size:1.1rem; }
  .map-btn{ display:inline-flex; align-items:center; gap:10px; margin-top:22px;
    background:#fff; color:var(--red); font-family:'Fredoka',sans-serif; font-weight:700;
    font-size:1rem; text-decoration:none; padding:14px 30px; border-radius:40px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25); transition:transform 0.25s ease, box-shadow 0.25s ease; }
  .map-btn:hover{ transform:translateY(-3px) scale(1.03); box-shadow:0 10px 26px rgba(0,0,0,0.35); }
  .map-btn .pin{ font-size:1.2rem; animation:pinBounce 1.6s ease-in-out infinite; }
  @keyframes pinBounce{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }

  @media (max-width:600px){
    .ribbon{ padding:10px 34px; }
    .chalkboard{ padding:26px 20px; border-width:8px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div id="hearts"></div>

<header>
  <img class="hero-logo" src="3encantos.png" alt="Los 3 Encantos">
  <div class="hero-script">¡Sabor que enamora!</div>
  <div class="hero-sub">Cocinando con amor y sirviendo a nuestra gente</div>
  <div class="scroll-cue"></div>
</header>

<nav>
  <button class="tab active" data-target="menu">Menú del Día</button>
  <button class="tab" data-target="carta">A la Carta</button>
  <button class="tab" data-target="bebidas">Bebidas</button>
</nav>

<main id="main"></main>

<footer>
  <div class="fname">Los 3 Encantos</div>
  <div class="addr">📍 Mz. W5 Lote 18, Los Licenciados, Ventanilla</div>
  <div class="foot-tag">Comidas criollas y marinas · <span class="script">Hechas con amor</span> ❤</div>
  <a class="map-btn" href="https://maps.app.goo.gl/3JQRHNhGy1amZNTt8?g_st=aw" target="_blank" rel="noopener">
    <span class="pin">📍</span> ¿Dónde nos encontramos?
  </a>
</footer>

<script>
/* ================= DATA — edita aquí tus platos y precios ================= */
const menuData = {
  menu:{
    ribbon:"Menú",
    subtitle:"Comidas criollas, hechas como en casa",
    badge:{ label:"A solo", value:"S/ 11" },
    style:"chalkboard",
    groups:[
      { name:"Entradas", items:[
        {name:"Sopa de pollo"},
        {name:"Ensalada de palta"},
        {name:"Chicharrón de calamar"},
      ]},
      { name:"Segundos", items:[
        {name:"Tallarín verde con bisteck"},
        {name:"Adobo de res con panamito"},
        {name:"Pescado frito con papa"},
        {name:"Pollada con papa sancochada"},
      ]}
    ]
  },
  carta:{
    ribbon:"A la Carta",
    subtitle:"Restaurant Cevichería — sabor del mar y criollo",
    style:"grouplist",
    groups:[
      { name:"Dúos Marinos", price:"S/ 20", items:[
        {name:"Ceviche + Chicharrón de pescado"},
        {name:"Ceviche + Arroz con mariscos"},
        {name:"Ceviche + Jalea de pescado"},
        {name:"Ceviche + Chaufa de pescado"},
        {name:"Ceviche + Chaufa de mariscos"},
      ]},
      { name:"Tríos Marinos", price:"S/ 25", items:[
        {name:"Ceviche + Chicharrón + Arroz con mariscos"},
        {name:"Ceviche + Chaufa de mariscos + Chicharrón"},
        {name:"Ceviche + Jalea mixta + Arroz con mariscos"},
        {name:"Ceviche + Chicharrón + Jalea mixta"},
      ]},
      { name:"Los Enteros", price:"S/ 15", items:[
        {name:"Trucha frita con yuca y arroz"},
        {name:"Tilapia frita con yuca y arroz"},
        {name:"Cachema frita con yuca y arroz"},
        {name:"Cabrilla frita con yuca y arroz"},
      ]},
      { name:"Filetes", price:"S/ 15", items:[
        {name:"Filete de corvina"},
        {name:"Filete de cojinova"},
        {name:"Filete de mero"},
      ]},
      { name:"Criollos y Norteños", price:"S/ 20", items:[
        {name:"Arroz con pato"},
        {name:"Tacu-tacu y seco de pato"},
        {name:"Seco de pato con frejoles"},
        {name:"Lomo a lo pobre"},
        {name:"Suprema de pollo"},
        {name:"Pechuga a la plancha"},
      ]}
    ]
  },
  bebidas:{
    ribbon:"Bebidas",
    subtitle:"El brindis que acompaña cada plato",
    style:"cards",
    groups:[
      { name:"Bebidas", items:[
        {name:"Chicha morada", desc:"Maíz morado, piña y especias, receta de la casa.", price:"S/ 8"},
        {name:"Limonada frozen", desc:"Limón batido con hielo, bien refrescante.", price:"S/ 9"},
        {name:"Gaseosa personal", desc:"Inca Kola, Coca-Cola o del día, bien helada.", price:"S/ 6"},
        {name:"Cerveza", desc:"Botella o vaso, bien fría.", price:"S/ 12"},
        {name:"Chilcano", desc:"Pisco, ginger ale y limón, servido bien frío.", price:"S/ 15"},
        {name:"Agua mineral", desc:"Con o sin gas.", price:"S/ 4"},
      ]}
    ]
  }
};

/* ================= Render ================= */
const main = document.getElementById('main');

function renderPanel(key){
  const data = menuData[key];
  let html = `<div class="ribbon">${data.ribbon}</div>`;
  html += `<div class="panel-sub">${data.subtitle}</div>`;
  if(data.badge){
    html += `<div class="price-badge"><div class="circle"><span class="lbl">${data.badge.label}</span><span class="val">${data.badge.value}</span></div></div>`;
  }

  if(data.style === "chalkboard"){
    html += `<div class="chalkboard">`;
    data.groups.forEach(g=>{
      html += `<div class="chalk-group"><h3>${g.name}:</h3>`;
      g.items.forEach(it=>{
        html += `<div class="chalk-item"><span>${it.name}${it.desc ? `<small>${it.desc}</small>` : ''}</span></div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  } else if(data.style === "grouplist"){
    html += `<div class="menu-sections">`;
    data.groups.forEach(g=>{
      html += `<div class="menu-section">
        <div class="menu-section-head"><h3>${g.name}</h3><span class="menu-section-price">${g.price}</span></div>`;
      g.items.forEach(it=>{
        html += `<div class="menu-list-item">${it.name}</div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  } else {
    data.groups.forEach((g,i)=>{
      html += `<div class="cards">`;
      g.items.forEach(it=>{
        html += `<div class="card">
          ${it.img ? `<img class="card-img" src="${it.img}" alt="${it.name}" loading="lazy">` : ''}
          <div class="card-body">
            <div class="card-top">
              <div class="card-name">${it.name}</div>
              <div class="card-price">${it.price}</div>
            </div>
            <div class="card-desc">${it.desc || ''}</div>
          </div>
        </div>`;
      });
      html += `</div>`;
      if(i < data.groups.length-1) html += `<div class="divider">❤</div>`;
    });
  }
  return html;
}

main.innerHTML = Object.keys(menuData).map(key=>
  `<section class="panel" id="panel-${key}">${renderPanel(key)}</section>`
).join('');

/* ================= Tabs ================= */
const tabs = document.querySelectorAll('.tab');
function activateTab(target, tabEl){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+target).classList.add('active');
  tabs.forEach(t=>t.classList.remove('active'));
  tabEl.classList.add('active');
  revealItems();
}
tabs.forEach(tab=> tab.addEventListener('click', ()=> activateTab(tab.dataset.target, tab)));

window.addEventListener('load', ()=>{
  document.getElementById('panel-menu').classList.add('active');
  revealItems();
});

/* ================= Reveal ================= */
function revealItems(){
  const items = document.querySelectorAll('.panel.active .card:not(.reveal), .panel.active .chalk-item:not(.reveal), .panel.active .menu-section:not(.reveal)');
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach((entry, idx)=>{
      if(entry.isIntersecting){
        setTimeout(()=> entry.target.classList.add('reveal'), (idx%6)*80);
        obs.unobserve(entry.target);
      }
    });
  }, { threshold:0.12 });
  items.forEach(d=> obs.observe(d));
}

/* ================= Floating hearts ================= */
const field = document.getElementById('hearts');
for(let i=0;i<20;i++){
  const h = document.createElement('div');
  h.className='heart'; h.textContent='❤';
  h.style.left = Math.random()*100 + 'vw';
  h.style.setProperty('--drift', (Math.random()*70-35)+'px');
  h.style.animationDuration = (9 + Math.random()*9) + 's';
  h.style.animationDelay = (Math.random()*11) + 's';
  h.style.fontSize = (10 + Math.random()*12) + 'px';
  field.appendChild(h);
}
</script>
</body>
</html>
